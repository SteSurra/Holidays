name: Public content safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-public-content.mjs
      - run: node scripts/check-guide-integrity.mjs
      # Deterministico e senza rete: confronta l'ordine calcolato con l'ottimo
      # per forza bruta. Gli altri check (link, alloggi, fermate) chiamano
      # servizi esterni e restano manuali.
      - run: node scripts/check-route-optimizer.mjs
